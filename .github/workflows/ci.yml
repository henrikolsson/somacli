name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Public Cachix cache that Nix builds are pushed to (free for open source).
  CACHIX_CACHE: somacli

jobs:
  go:
    name: go (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Caches the module and build caches, keyed on go.sum.
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::not gofmt'ed: $unformatted"
            exit 1
          fi
      - run: go mod verify
      - run: go vet ./...
      - run: go test ./...

  nix:
    name: nix (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: ${{ env.CACHIX_CACHE }}
          # Without the secret (forks, or before it's set up) the cache is
          # only read from.
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # Also catches a stale vendorHash in flake.nix.
      - run: nix flake check -L
      - run: nix build -L
      - run: ./result/bin/somacli --version
